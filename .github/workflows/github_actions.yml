name: Build Nexy

on:
  workflow_dispatch: {}
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (release tag or branch)
        required: true
        type: string
      version:
        description: Version override (defaults to the Version file)
        required: false
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  set_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      date: ${{ steps.version.outputs.date }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - id: version
        env:
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          export FILENAME="${VERSION_OVERRIDE:-$(cat Version)}"
          export DATE="${FILENAME}"
          echo "version=${FILENAME}" >> $GITHUB_OUTPUT
          echo "date=${DATE}" >> $GITHUB_OUTPUT

  build_windows:
    runs-on: windows-latest
    needs: [set_version, build_node]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: ./.github/actions/build-electron
        with:
          nexy-version: '${{ needs.set_version.outputs.version }}'
          platform: x64
          runtime-identifier: win-x64
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: html
          path: build/html
      - uses: actions/download-artifact@v8
        with:
          name: Electron-Release_win-x64
          path: build/Electron
      - name: Package Windows Electron installer and portable ZIP
        env:
          NEXY_WINDOWS_SIGNING: ${{ vars.NEXY_WINDOWS_SIGNING }}
          NEXY_AZURE_SIGNING_ENDPOINT: ${{ vars.NEXY_AZURE_SIGNING_ENDPOINT }}
          NEXY_AZURE_SIGNING_ACCOUNT: ${{ vars.NEXY_AZURE_SIGNING_ACCOUNT }}
          NEXY_AZURE_SIGNING_PROFILE: ${{ vars.NEXY_AZURE_SIGNING_PROFILE }}
          NEXY_SIGNING_PUBLISHER: ${{ vars.NEXY_SIGNING_PUBLISHER }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run build-electron
      - uses: actions/upload-artifact@v7
        with:
          name: Electron-Windows-x64
          path: |
            build/*Setup_x64.exe
            build/*.zip

  build_dotnet_linux:
    runs-on: ubuntu-latest
    needs: set_version
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: ./.github/actions/build-electron
        with:
          nexy-version: '${{ needs.set_version.outputs.version }}'
          platform: x64
          runtime-identifier: linux-x64

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: ./.github/actions/build-electron
        with:
          nexy-version: '${{ needs.set_version.outputs.version }}'
          platform: arm64
          runtime-identifier: linux-arm64

  build_dotnet_macos:
    runs-on: macos-latest
    needs: set_version
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: ./.github/actions/build-electron
        with:
          nexy-version: '${{ needs.set_version.outputs.version }}'
          platform: x64
          runtime-identifier: osx-x64

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: ./.github/actions/build-electron
        with:
          nexy-version: '${{ needs.set_version.outputs.version }}'
          platform: arm64
          runtime-identifier: osx-arm64

  build_node:
    runs-on: ubuntu-latest
    needs: [set_version, build_dotnet_linux]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Set version
        run: |
          echo "${{ needs.set_version.outputs.version }}" > Version
          cat Version
      - name: Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Get npm cache directory
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> ${GITHUB_OUTPUT}
      - uses: actions/cache@v5
        id: npm-cache # use this to check for `cache-hit` ==> if: steps.npm-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Restore dependencies
        run: npm ci
      - name: Build html
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SentryAuthToken }}
        run: npm run prod
      - name: Upload html artifacts
        uses: actions/upload-artifact@v7
        with:
          name: html
          path: build/html

      - name: Download Electron x64 dotnet artifacts
        uses: actions/download-artifact@v8
        with:
          name: Electron-Release_linux-x64
          path: build/Electron
      - name: Build x64 AppImage
        run: npm run build-electron
      - name: Upload Electron x64 AppImage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Electron-AppImage-x64
          path: 'build/Nexy_${{ needs.set_version.outputs.version }}_x64.AppImage'

      - name: Download Electron arm64 dotnet artifacts
        uses: actions/download-artifact@v8
        with:
          name: Electron-Release_linux-arm64
          path: build/Electron
      - name: Build arm64 AppImage
        run: npm run build-electron-arm64
      - name: Upload Electron arm64 AppImage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Electron-AppImage-arm64
          path: 'build/Nexy_${{ needs.set_version.outputs.version }}_arm64.AppImage'

  build_macos:
    runs-on: macos-latest
    needs: [set_version, build_dotnet_macos]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Set version
        run: |
          echo "${{ needs.set_version.outputs.version }}" > Version
          cat Version
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Get npm cache directory
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> ${GITHUB_OUTPUT}
      - uses: actions/cache@v5
        id: npm-cache # use this to check for `cache-hit` ==> if: steps.npm-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Restore dependencies
        run: npm ci
      - name: Build html x64
        run: npm run prod --arch=x64

      - name: Download x64 Electron dotnet artifacts
        uses: actions/download-artifact@v8
        with:
          name: Electron-Release_osx-x64
          path: build/Electron
      - name: Build x64 macOS .dmg
        run: npm run build-electron
      - name: Upload x64 Electron macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Electron-MacDmg-x64
          path: 'build/Nexy_${{ needs.set_version.outputs.version }}_x64.dmg'

      - name: Cleanup
        run: |
          rm -R build/Electron

      - name: Build html arm64
        run: npm run prod --arch=arm64

      - name: Download arm64 Electron dotnet artifacts
        uses: actions/download-artifact@v8
        with:
          name: Electron-Release_osx-arm64
          path: build/Electron
      - name: Build arm64 macOS .dmg
        run: npm run build-electron-arm64
      - name: Upload arm64 Electron macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Electron-MacDmg-arm64
          path: 'build/Nexy_${{ needs.set_version.outputs.version }}_arm64.dmg'
