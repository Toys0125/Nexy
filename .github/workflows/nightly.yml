name: Nightly

on:
  schedule:
    # Twice a day, at midnight and midday UTC. Runs with no new commits on master are skipped.
    - cron: '0 0 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Build even if master has not changed since the last nightly
        required: false
        type: boolean
        default: false
      skip-macos:
        description: Skip the macOS packages (when no macOS runners are available)
        required: false
        type: boolean
        default: false

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare nightly
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      sha: ${{ steps.check.outputs.sha }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      previous_tag: ${{ steps.check.outputs.previous_tag }}
    steps:
      - name: Check for changes since last nightly
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FORCE: ${{ inputs.force || false }}
          TZ: Europe/Helsinki
        run: |
          sha="$(gh api "repos/$GH_REPO/commits/master" --jq '.sha')"

          last_tag="$(gh release list --limit 100 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | endswith("-nightly")))] | sort_by(.createdAt) | last | .tagName // ""')"
          last_sha=""
          if [ -n "$last_tag" ]; then
            last_sha="$(gh api "repos/$GH_REPO/commits/$last_tag" --jq '.sha')"
          fi
          echo "master: ${sha}; last nightly: ${last_tag:-none} (${last_sha:-n/a})"

          if [ "$FORCE" != "true" ] && [ "$sha" = "$last_sha" ]; then
            echo "No new commits since ${last_tag}; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Stamped into the build as-is. The app shows it, reads the -nightly suffix as the
          # Nightly channel, and marks the release whose title "Nexy <version>" matches as current.
          # Dated in Helsinki time. Later builds the same day insert -2, -3, ... after the date
          # (the updater's same-day build number) so earlier nightlies are kept.
          date="$(date +%Y.%m.%d)"
          version="v${date}-nightly"
          n=2
          while gh release view "$version" > /dev/null 2>&1; do
            version="v${date}-${n}-nightly"
            n=$((n + 1))
          done

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${version}" >> "$GITHUB_OUTPUT"
          echo "previous_tag=${last_tag}" >> "$GITHUB_OUTPUT"

  builds:
    name: Build Nexy nightly packages
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/github_actions.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}
      require-windows-signing: false
      build-macos: ${{ !inputs.skip-macos }}
    secrets: inherit

  macos_watchdog:
    name: Watch macOS runner queue
    needs: prepare
    if: needs.prepare.outputs.skip != 'true' && !inputs.skip-macos
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # Never fail the nightly on its own account.
    continue-on-error: true
    permissions:
      actions: write
    steps:
      - name: Restart without macOS if build_macos waits too long for a runner
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          REF: ${{ github.ref_name }}
          QUEUE_LIMIT_MINUTES: 15
        run: |
          # timeout-minutes does not cover time spent queued for a runner, and macOS runners
          # can stay unavailable for hours. Rather than hold up the whole nightly, start it
          # again without macOS and cancel this run.
          queued_since=""
          while true; do
            status="$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
              --jq '[.jobs[] | select(.name | endswith("build_macos"))] | first | .status // ""')"
            case "$status" in
              completed)
                echo "build_macos finished."
                exit 0
                ;;
              queued)
                now="$(date +%s)"
                queued_since="${queued_since:-$now}"
                if (( now - queued_since >= QUEUE_LIMIT_MINUTES * 60 )); then
                  echo "::warning::build_macos waited ${QUEUE_LIMIT_MINUTES} minutes for a macOS runner; restarting the nightly without macOS."
                  # The new run waits on the nightly concurrency group until this one is cancelled.
                  gh workflow run nightly.yml --ref "$REF" -f skip-macos=true -f force=true
                  gh run cancel "$RUN_ID"
                  exit 0
                fi
                ;;
              *)
                queued_since=""
                ;;
            esac
            sleep 60
          done

  publish:
    name: Publish nightly prerelease
    needs: [prepare, builds]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Extract Windows Electron installer and portable ZIP
        uses: actions/download-artifact@v8
        with:
          name: Electron-Windows-x64
          path: release-assets

      - name: Download Linux AppImages
        uses: actions/download-artifact@v8
        with:
          pattern: Electron-AppImage-*
          path: release-assets
          merge-multiple: true

      - name: Download macOS DMGs
        if: ${{ !inputs.skip-macos }}
        uses: actions/download-artifact@v8
        with:
          pattern: Electron-MacDmg-*
          path: release-assets
          merge-multiple: true

      - name: Verify release packages
        shell: bash
        env:
          SKIP_MACOS: ${{ inputs.skip-macos || false }}
        run: |
          shopt -s nullglob
          expected=(
            'Nexy_*_Setup_x64.exe'
            'Nexy_*_x64.zip'
            'Nexy_*_x64.AppImage'
            'Nexy_*_arm64.AppImage'
          )
          if [ "${SKIP_MACOS:-false}" != "true" ]; then
            expected+=('Nexy_*_x64.dmg' 'Nexy_*_arm64.dmg')
          fi
          for pattern in "${expected[@]}"; do
            matches=(release-assets/$pattern)
            if (( ${#matches[@]} != 1 )); then
              echo "Expected one release asset matching $pattern; found ${#matches[@]}" >&2
              exit 1
            fi
          done
          assets=(release-assets/*)
          if (( ${#assets[@]} != ${#expected[@]} )); then
            echo "Expected ${#expected[@]} release assets; found ${#assets[@]}" >&2
            exit 1
          fi

      - name: Create nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
        run: |
          # Changelog since the previous nightly.
          notes=""
          if [ -n "$PREVIOUS_TAG" ]; then
            notes="$(gh api "repos/$GH_REPO/compare/${PREVIOUS_TAG}...${SHA}" \
              --jq '"## Changes since \($ENV.PREVIOUS_TAG)\n\n" + ([.commits[] | "- \(.commit.message | split("\n")[0]) (\(.sha[0:7]))"] | join("\n"))')"
          fi
          footer="Automated nightly build of master at ${SHA}. Nightly builds are untested and may be unstable."
          if [ -n "$notes" ]; then
            notes="$(printf '%s\n\n---\n%s' "$notes" "$footer")"
          else
            notes="$footer"
          fi

          gh release create "$TAG" release-assets/* \
            --prerelease \
            --target "$SHA" \
            --title "Nexy ${VERSION}" \
            --notes "$notes"
